<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOOCAP — Scripts</title>
<style>
:root{
  --bg:#080a10; --panel:#0e1119; --panel2:#121621; --line:#1c2130;
  --tx:#e7e9ee; --tx2:#8e96a6; --tx3:#5b6273;
  --green:#3ddc97; --greenbg:rgba(61,220,151,.12);
  --amber:#f0b429; --amberbg:rgba(240,180,41,.12);
  --red:#f16b6b; --redbg:rgba(241,107,107,.12);
  --blue:#6d8cff; --bluebg:rgba(109,140,255,.15);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:var(--tx2);background:transparent;border:1px solid var(--line);
  border-radius:7px;padding:6px 13px;cursor:pointer}
button:hover{border-color:#2a3143;color:var(--tx)}
button.on{background:var(--panel2);border-color:#333c52;color:var(--tx)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=range]{accent-color:#6d8cff;width:130px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 26px 70px}
h1{font-size:23px;font-weight:600;margin:0}
.sub{color:var(--tx3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
.kpi .lab{font-size:11.5px;color:var(--tx3)}
.kpi .val{font-size:31px;font-weight:600;margin-top:5px;line-height:1}
.risk{border-color:rgba(241,107,107,.35)}
.sec{margin-top:26px}
.sechd{font-size:12.5px;color:var(--tx3);margin:0 0 10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 16px;border-top:1px solid var(--line)}
.vt{font-size:13.5px;border-bottom:1px solid transparent}
.vt:hover{border-bottom-color:var(--tx3);color:#fff}
.who{color:var(--tx3)}
.chip{font-size:11px;padding:3px 9px;border-radius:6px;white-space:nowrap}
.c-g{background:var(--greenbg);color:var(--green)}
.c-a{background:var(--amberbg);color:var(--amber)}
.c-r{background:var(--redbg);color:var(--red)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;background:var(--panel2);border-bottom:1px solid var(--line);
  border-radius:12px 12px 0 0}
.name{font-size:14.5px;font-weight:500}
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pick{display:flex;gap:5px}
.pick button{padding:7px 0;width:38px;text-align:center;border-radius:8px;font-size:14px}
.pick button.rec{border-color:#33507f;color:var(--tx)}
.pick button.sel{background:var(--bluebg);border-color:var(--blue);color:#fff;font-weight:600}
.meter{height:5px;background:#171c28;border-radius:3px;overflow:hidden;margin:11px 0 8px}
.meter i{display:block;height:100%}
.why{font-size:12.5px;color:var(--tx2);line-height:1.55}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:10.5px;color:var(--tx3);text-align:center;padding:2px 0 6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px 9px;
  min-height:66px;cursor:pointer;text-align:left;color:inherit;display:block;width:100%}
.day:hover{border-color:#2a3143}
.day.sel{border-color:var(--blue);background:var(--panel2)}
.day.out{opacity:.32}
.dnum{font-size:12px;color:var(--tx2);margin-bottom:6px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.legend{display:flex;gap:17px;flex-wrap:wrap;color:var(--tx3);font-size:12px;margin:12px 0 14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.filters button{padding:5px 12px;font-size:12.5px;border-radius:20px}
.empty{padding:20px 16px;color:var(--tx3);font-size:13px}
.banner{border:1px solid rgba(241,107,107,.4);background:var(--redbg);color:var(--red);
  border-radius:11px;padding:13px 16px;font-size:13px;margin-bottom:16px;display:none}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid7{gap:3px}.day{min-height:54px;padding:5px}.wrap{padding:20px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">

<div class="between">
  <div>
    <h1>Scripts</h1>
    <div class="sub" id="hsub">loading boards…</div>
  </div>
  <div class="row">
    <span class="sub">stay</span>
    <input type="range" id="buf" min="1" max="4" step="0.5" value="2">
    <span style="font-weight:500;min-width:88px" id="buflab">2 weeks ahead</span>
    <button id="reload">Reload</button>
  </div>
</div>

<div class="banner" id="banner"></div>

<div class="kpis">
  <div class="kpi"><div class="lab">Scripts banked</div><div class="val" id="k1">—</div></div>
  <div class="kpi"><div class="lab">Weeks of runway</div><div class="val" id="k2">—</div></div>
  <div class="kpi"><div class="lab">To write next week</div><div class="val" id="k3" style="color:var(--blue)">—</div></div>
  <div class="kpi risk"><div class="lab">Locked dates, no script</div><div class="val" id="k4" style="color:var(--red)">—</div></div>
</div>

<div class="card risk" id="riskbox" style="overflow:hidden"></div>

<div class="sec">
  <p class="sechd">How many for next week</p>
  <div class="dec" id="dec"></div>
  <div class="row" style="margin-top:14px">
    <button id="save" style="border-color:#33507f;color:var(--tx)">Save next week's plan to Notion</button>
    <span class="sub" id="savenote"></span>
  </div>
</div>

<div class="sec">
  <div class="between" style="margin-bottom:4px">
    <p class="sechd" style="margin:0">Calendar</p>
    <div class="row" style="gap:6px">
      <button id="mp">&lsaquo;</button>
      <span id="mlab" style="min-width:132px;text-align:center;font-weight:500"></span>
      <button id="mn">&rsaquo;</button>
      <span style="width:10px"></span>
      <button id="vpost" class="on">Post dates</button>
      <button id="vdue">Script due</button>
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--green);display:inline-block;margin-right:7px"></span>script approved</span>
    <span><span class="dot" style="background:var(--amber);display:inline-block;margin-right:7px"></span>in scripting</span>
    <span><span class="dot" style="background:var(--red);display:inline-block;margin-right:7px"></span>not started</span>
    <span id="duenote" style="display:none">script due = post date &minus; <b id="lead">12</b> days</span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid7" id="dows"></div>
  <div class="grid7" id="cal" style="margin-top:5px"></div>
  <div class="card" id="daypanel" style="margin-top:14px;overflow:hidden"></div>
</div>

</div>

<script>
var STAGES = {1:'idea assigned',2:'waiting for brief',3:'transcript',4:'script draft',
5:'script approval',6:'to film',7:'in edit',8:'changes',9:'approval',10:'to post',
11:'ready',12:'posted',13:'repost'};

var V=[], RATE={}, CREATORS=[], LEAD_DAYS=12;
var buffer=2, chosen={}, calMode='post', who='all', saving=false;
var TODAY=startOfDay(new Date());
var calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
var selDay=new Date(TODAY);
var nextWeek=addD(mondayOf(TODAY),7);

function startOfDay(x){var y=new Date(x);y.setHours(0,0,0,0);return y}
function mondayOf(x){var n=new Date(x);var k=(n.getDay()+6)%7;n.setDate(n.getDate()-k);n.setHours(0,0,0,0);return n}
function addD(x,n){var y=new Date(x);y.setDate(y.getDate()+n);return y}
function same(a,b){return a&&b&&a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function fmt(x){return x.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}
function dmy(x){return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function notionURL(id){return 'https://notion.so/'+String(id).replace(/-/g,'')}
function pdate(v){return v.postDate?startOfDay(new Date(v.postDate)):null}
function dueOf(v){var p=pdate(v);return p?addD(p,-LEAD_DAYS):null}
function tone(s){return s>=5?'g':(s>=3?'a':'r')}
function toneHex(s){return s>=5?'var(--green)':(s>=3?'var(--amber)':'var(--red)')}
function label(s){return STAGES[s]||('stage '+s)}

function banked(c){return V.filter(function(v){return v.creator===c&&v.stage>=5&&v.stage<12}).length}
function inFlight(c){return V.filter(function(v){return v.creator===c&&v.stage<5}).length}
function rateOf(c){return RATE[c]||1}
function runway(c){return banked(c)/rateOf(c)}
function recFor(c){return Math.max(0,Math.round(rateOf(c)*(buffer+1)-banked(c)))}

function showBanner(msg){
  var b=document.getElementById('banner');
  if(!msg){b.style.display='none';return}
  b.style.display='block';b.textContent=msg;
}

async function load(fresh){
  try{
    var r=await fetch('/api/scripts'+(fresh?'?fresh=1':''));
    if(!r.ok) throw new Error('api returned '+r.status);
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    V=j.videos||[]; RATE=j.rates||{}; CREATORS=j.creators||[]; LEAD_DAYS=j.leadDays||12;
    document.getElementById('lead').textContent=LEAD_DAYS;
    document.getElementById('hsub').textContent=
      'planning week of '+dmy(nextWeek)+' · '+V.length+' videos · synced '+
      new Date(j.syncedAt).toLocaleTimeString('en-GB');
    showBanner((j.problems&&j.problems.length)?('Some boards did not load — '+j.problems.join(' · ')):'');
    render();
  }catch(e){
    showBanner('Could not reach Notion — '+e.message+'. Retrying in 20s.');
    setTimeout(function(){load(true)},20000);
  }
}

function render(){
  document.getElementById('buflab').textContent=buffer+' week'+(buffer==1?'':'s')+' ahead';

  var tb=0,tr=0,rec=0;
  CREATORS.forEach(function(c){tb+=banked(c);tr+=rateOf(c);rec+=(chosen[c]!==undefined?chosen[c]:recFor(c))});
  var risk=V.filter(function(v){var d=dueOf(v);return v.stage<5&&d&&d<=TODAY})
    .sort(function(a,b){return pdate(a)-pdate(b)});

  document.getElementById('k1').textContent=tb;
  document.getElementById('k2').textContent=tr?(tb/tr).toFixed(1):'—';
  document.getElementById('k3').textContent=rec;
  document.getElementById('k4').textContent=risk.length;

  document.getElementById('riskbox').innerHTML = risk.length
    ? '<div class="chd" style="background:transparent;border-bottom:1px solid rgba(241,107,107,.22)">'+
      '<span class="name" style="color:var(--red)">Script already overdue against its post date</span>'+
      '<span class="sub">'+risk.length+'</span></div>'+
      risk.map(function(v){return '<div class="crow" style="border-top-color:rgba(241,107,107,.14)">'+
        '<a class="vt" href="'+notionURL(v.id)+'" target="_blank" rel="noopener"><span class="who">'+
        esc(v.creator)+' · </span>'+esc(v.title)+'</a>'+
        '<span class="chip c-r">posts '+dmy(pdate(v))+' · '+esc(label(v.stage))+'</span></div>'}).join('')
    : '<div class="empty">Nothing has blown its script deadline.</div>';

  document.getElementById('dec').innerHTML=CREATORS.map(function(c){
    var r=recFor(c), b=banked(c), f=inFlight(c), run=runway(c);
    var pickVal=chosen[c]!==undefined?chosen[c]:r;
    var opts=[Math.max(0,r-1),r,r+1,r+2].filter(function(x,i,a){return a.indexOf(x)===i});
    var covered=addD(TODAY,Math.round(run*7));
    var pct=Math.min(100,Math.round(run/buffer*100));
    var col=run>=buffer?'var(--green)':(run>=buffer*0.5?'var(--amber)':'var(--red)');
    var why=run>=buffer
      ? 'Already '+run.toFixed(1)+' weeks ahead, so '+r+' keeps that cushion where it is.'
      : 'Runs dry around '+dmy(covered)+', so '+r+' pulls back to '+buffer+' weeks and covers what goes out.';
    return '<div class="card" style="overflow:hidden">'+
      '<div class="chd"><span class="name">'+esc(c)+'</span><span class="sub">posts '+rateOf(c)+'/wk</span></div>'+
      '<div style="padding:13px 16px 15px">'+
        '<div class="between" style="align-items:flex-end">'+
          '<div><div style="font-size:26px;font-weight:600;line-height:1">'+b+'</div>'+
          '<div class="sub">banked · '+f+' still in scripting</div></div>'+
          '<div class="pick" data-c="'+esc(c)+'">'+opts.map(function(o){
            return '<button data-v="'+o+'" class="'+(o===r?'rec ':'')+(o===pickVal?'sel':'')+'">'+o+'</button>'}).join('')+
          '</div>'+
        '</div>'+
        '<div class="meter"><i style="width:'+pct+'%;background:'+col+'"></i></div>'+
        '<div class="why">'+why+'</div>'+
      '</div></div>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.pick button'),function(b){
    b.onclick=function(){chosen[b.parentNode.dataset.c]=+b.dataset.v;
      document.getElementById('savenote').textContent='';render()}});

  renderCal();
}

function onDay(day){
  return V.filter(function(v){
    if(who!=='all'&&v.creator!==who) return false;
    var d=calMode==='due'?dueOf(v):pdate(v);
    return same(d,day);
  }).sort(function(a,b){return a.stage-b.stage});
}

function renderCal(){
  document.getElementById('mlab').textContent=calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  document.getElementById('duenote').style.display=calMode==='due'?'inline':'none';
  document.getElementById('dows').innerHTML=['MON','TUE','WED','THU','FRI','SAT','SUN']
    .map(function(x){return '<div class="dow">'+x+'</div>'}).join('');
  document.getElementById('filters').innerHTML=
    '<button data-w="all" class="'+(who==='all'?'on':'')+'">All creators</button>'+
    CREATORS.map(function(c){return '<button data-w="'+esc(c)+'" class="'+(who===c?'on':'')+'">'+esc(c)+'</button>'}).join('');

  var start=mondayOf(new Date(calMonth.getFullYear(),calMonth.getMonth(),1)),cells='';
  for(var i=0;i<42;i++){
    var day=addD(start,i),list=onDay(day),out=day.getMonth()!==calMonth.getMonth();
    if(i>=35&&out) continue;
    cells+='<button class="day'+(out?' out':'')+(same(day,selDay)?' sel':'')+'" data-i="'+i+'">'+
      '<div class="dnum"'+(same(day,TODAY)?' style="color:var(--blue);font-weight:600"':'')+'>'+day.getDate()+'</div>'+
      '<div class="dots">'+list.slice(0,12).map(function(v){
        return '<span class="dot" style="background:'+toneHex(v.stage)+'"></span>'}).join('')+'</div></button>';
  }
  document.getElementById('cal').innerHTML=cells;
  Array.prototype.forEach.call(document.querySelectorAll('.day'),function(b){
    b.onclick=function(){selDay=addD(start,+b.dataset.i);renderCal()}});
  Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(b){
    b.onclick=function(){who=b.dataset.w;renderCal()}});

  var sel=onDay(selDay),lab=calMode==='due'?'script due':'posting';
  document.getElementById('daypanel').innerHTML=
    '<div class="chd"><span class="name">'+fmt(selDay)+'</span><span class="sub">'+
    (sel.length?sel.length+' '+lab+' · '+sel.filter(function(v){return v.stage<5}).length+' unscripted':'nothing '+lab)+
    '</span></div>'+
    (sel.length?sel.map(function(v){return '<div class="crow">'+
      '<a class="vt" href="'+notionURL(v.id)+'" target="_blank" rel="noopener"><span class="who">'+
      esc(v.creator)+' · </span>'+esc(v.title)+'</a>'+
      '<span class="chip c-'+tone(v.stage)+'">'+v.stage+' · '+esc(label(v.stage))+
      (calMode==='due'&&pdate(v)?' · posts '+dmy(pdate(v)):'')+'</span></div>'}).join('')
      :'<div class="empty">Clear day.</div>');
}

// --- writing the plan back to Notion -------------------------------------
// api/add-video.js already appends a checkbox into a week's creator section.
// Confirm its expected body and adjust this one object if it differs.
function addVideoBody(weekStart, creator, n){
  return { week: weekStart, creator: creator, title: 'Script slot ' + n };
}

document.getElementById('save').onclick=async function(){
  if(saving) return;
  var plan=CREATORS.map(function(c){return {c:c,n:(chosen[c]!==undefined?chosen[c]:recFor(c))}})
    .filter(function(x){return x.n>0});
  var total=plan.reduce(function(a,x){return a+x.n},0);
  if(!total){document.getElementById('savenote').textContent='nothing to write';return}
  var msg='Write '+total+' script slots into the week of '+dmy(nextWeek)+'?\n\n'+
    plan.map(function(x){return x.c+': '+x.n}).join('\n');
  if(!confirm(msg)) return;

  saving=true; this.disabled=true;
  var note=document.getElementById('savenote'); note.textContent='writing…';
  var wk=nextWeek.toISOString().slice(0,10), done=0, failed=[];
  for(const p of plan){
    for(let i=1;i<=p.n;i++){
      try{
        const r=await fetch('/api/add-video',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(addVideoBody(wk,p.c,i))});
        if(!r.ok) throw new Error(r.status);
        done++;
      }catch(e){ failed.push(p.c+' #'+i) }
      note.textContent='writing… '+done+'/'+total;
    }
  }
  note.textContent = failed.length
    ? done+' written, '+failed.length+' failed ('+failed.slice(0,3).join(', ')+')'
    : done+' slots written into the week of '+dmy(nextWeek);
  saving=false; this.disabled=false;
  load(true);
};

document.getElementById('buf').oninput=function(){buffer=+this.value;chosen={};render()};
document.getElementById('reload').onclick=function(){load(true)};
document.getElementById('mp').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderCal()};
document.getElementById('mn').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderCal()};
document.getElementById('vpost').onclick=function(){calMode='post';this.classList.add('on');document.getElementById('vdue').classList.remove('on');renderCal()};
document.getElementById('vdue').onclick=function(){calMode='due';this.classList.add('on');document.getElementById('vpost').classList.remove('on');renderCal()};

load(false);
setInterval(function(){ if(!saving) load(false) }, 30000);
</script>
</body>
</html>
