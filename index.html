<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOOCAP — Scripts</title>
<style>
:root{
  --bg:#080a10; --panel:#0e1119; --panel2:#121621; --line:#1c2130;
  --tx:#e7e9ee; --tx2:#8e96a6; --tx3:#5b6273;
  --green:#3ddc97; --greenbg:rgba(61,220,151,.12);
  --amber:#f0b429; --amberbg:rgba(240,180,41,.12);
  --red:#f16b6b; --redbg:rgba(241,107,107,.12);
  --blue:#6d8cff; --bluebg:rgba(109,140,255,.15);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:var(--tx2);background:transparent;border:1px solid var(--line);
  border-radius:7px;padding:6px 13px;cursor:pointer}
button:hover{border-color:#2a3143;color:var(--tx)}
button.on{background:var(--panel2);border-color:#333c52;color:var(--tx)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=range]{accent-color:#6d8cff;width:130px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 26px 70px}
h1{font-size:23px;font-weight:600;margin:0}
.sub{color:var(--tx3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
.kpi .lab{font-size:11.5px;color:var(--tx3)}
.kpi .val{font-size:31px;font-weight:600;margin-top:5px;line-height:1}
.risk{border-color:rgba(241,107,107,.35)}
.sec{margin-top:26px}
.sechd{font-size:12.5px;color:var(--tx3);margin:0 0 10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 16px;border-top:1px solid var(--line)}
.vt{font-size:13.5px;border-bottom:1px solid transparent}
.vt:hover{border-bottom-color:var(--tx3);color:#fff}
.who{color:var(--tx3)}
.chip{font-size:11px;padding:3px 9px;border-radius:6px;white-space:nowrap}
.c-g{background:var(--greenbg);color:var(--green)}
.c-a{background:var(--amberbg);color:var(--amber)}
.c-r{background:var(--redbg);color:var(--red)}
.c-n{background:#161b27;color:var(--tx3)}
.k{font-size:10.5px;padding:2px 7px;border-radius:5px;margin-right:8px;letter-spacing:.02em}
.k-s{background:var(--bluebg);color:#93aaff}
.k-p{background:#1a1f2c;color:var(--tx2)}
.k-l{background:rgba(167,139,250,.15);color:#b9a5fb}
.k-sh{background:#1a1f2c;color:var(--tx2)}
.day.past{opacity:.5}
.day.today{border-color:var(--blue)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;background:var(--panel2);border-bottom:1px solid var(--line);
  border-radius:12px 12px 0 0}
.name{font-size:14.5px;font-weight:500}
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.meter{height:5px;background:#171c28;border-radius:3px;overflow:hidden;margin:11px 0 8px}
.meter i{display:block;height:100%}
.why{font-size:12.5px;color:var(--tx2);line-height:1.55}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:10.5px;color:var(--tx3);text-align:center;padding:2px 0 6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px 9px;
  min-height:66px;cursor:pointer;text-align:left;color:inherit;display:block;width:100%}
.day:hover{border-color:#2a3143}
.day.sel{border-color:var(--blue);background:var(--panel2)}
.day.out{opacity:.32}
.dnum{font-size:12px;color:var(--tx2);margin-bottom:6px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.legend{display:flex;gap:17px;flex-wrap:wrap;color:var(--tx3);font-size:12px;margin:12px 0 14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.filters button{padding:5px 12px;font-size:12.5px;border-radius:20px}
.empty{padding:20px 16px;color:var(--tx3);font-size:13px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.rrow:first-of-type{border-top:0}
.x{border:0;background:transparent;color:var(--tx3);font-size:16px;padding:0 6px;cursor:pointer}
.x:hover{color:var(--red)}
input[type=range]{accent-color:#6d8cff;width:104px}
.field{background:#0b0e16;border:1px solid var(--line);border-radius:7px;color:var(--tx);
  padding:7px 11px;font:inherit;font-size:13px}
.field:focus{outline:none;border-color:var(--blue)}
.err{color:var(--red);font-size:12.5px;min-height:18px}
.banner{border:1px solid rgba(241,107,107,.4);background:var(--redbg);color:var(--red);
  border-radius:11px;padding:13px 16px;font-size:13px;margin-bottom:16px;display:none}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid7{gap:3px}.day{min-height:54px;padding:5px}.wrap{padding:20px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">

<div class="between">
  <div>
    <h1>Scripts</h1>
    <div class="sub" id="hsub">loading boards…</div>
  </div>
  <div class="row">
    <span class="sub">hold</span>
    <input type="range" id="cush" min="1" max="4" step="0.5" value="2">
    <span style="font-weight:500;min-width:74px" id="cushlab">2 weeks</span>
    <button id="rosterbtn">Creators</button>
    <button id="reload">Reload</button>
  </div>
</div>

<div class="card" id="roster" style="display:none;padding:15px 17px;margin-bottom:16px"></div>
<div class="banner" id="banner"></div>
<div class="card" id="session" style="overflow:hidden;margin-bottom:18px"></div>

<div class="kpis">
  <div class="kpi"><div class="lab" id="k1lab">Left this week</div><div class="val" id="k1">—</div></div>
  <div class="kpi"><div class="lab">Posting next week</div><div class="val" id="k2">—</div></div>
  <div class="kpi"><div class="lab">To write this week</div><div class="val" id="k3" style="color:var(--blue)">—</div></div>
  <div class="kpi risk"><div class="lab">Locked dates, no script</div><div class="val" id="k4" style="color:var(--red)">—</div></div>
</div>

<div class="card risk" id="riskbox" style="overflow:hidden"></div>

<div class="sec">
  <p class="sechd">By creator</p>
  <div class="dec" id="dec"></div>
</div>

<div class="sec">
  <div class="between" style="margin-bottom:4px">
    <p class="sechd" style="margin:0">Calendar</p>
    <div class="row" style="gap:6px">
      <button id="mp">&lsaquo;</button>
      <span id="mlab" style="min-width:132px;text-align:center;font-weight:500"></span>
      <button id="mn">&rsaquo;</button>
      <button id="mtoday">Today</button>
      <span style="width:10px"></span>
      <button id="vpost" class="on">Post dates</button>
      <button id="vdue">Script due</button>
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--green);display:inline-block;margin-right:7px"></span>script approved</span>
    <span><span class="dot" style="background:var(--amber);display:inline-block;margin-right:7px"></span>in scripting</span>
    <span><span class="dot" style="background:var(--red);display:inline-block;margin-right:7px"></span>not started</span>
    <span><span class="dot" style="background:#3a4152;display:inline-block;margin-right:7px"></span>already posted</span>
    <span id="duenote" style="display:none">Mon&ndash;Wed posts are due Friday, Thu&ndash;Sat posts are due Wednesday</span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid7" id="dows"></div>
  <div class="grid7" id="cal" style="margin-top:5px"></div>
  <div class="card" id="daypanel" style="margin-top:14px;overflow:hidden"></div>
</div>

<div class="sec">
  <button id="hkbtn">Housekeeping</button>
  <div class="card" id="hk" style="display:none;overflow:hidden;margin-top:12px"></div>
</div>

</div>

<script>
var STAGES = {1:'idea assigned',2:'waiting for brief',3:'transcript',4:'script draft',
5:'script approval',6:'to film',7:'in edit',8:'changes',9:'approval',10:'to post',
11:'ready',12:'posted',13:'repost'};

var V=[], RATE={}, CREATORS=[];
var calMode='post', who='all', saving=false;
var cushion=parseFloat(localStorage.getItem('noocap_scripts_cushion'))||2;
var BUILTIN=[], FORMATS={};

function readLS(k,fb){try{var v=JSON.parse(localStorage.getItem(k));return v||fb}catch(e){return fb}}
function writeLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var EXTRA=readLS('noocap_scripts_extra',[]);
var HIDDEN=readLS('noocap_scripts_hidden',[]);

function rosterQS(){
  var q=[];
  if(EXTRA.length) q.push('extra='+encodeURIComponent(EXTRA.map(function(x){
    return x.creator+':'+x.ds+':'+(x.format||'Short')}).join(',')));
  if(HIDDEN.length) q.push('hide='+encodeURIComponent(HIDDEN.join(',')));
  return q.join('&');
}
var TODAY=startOfDay(new Date());
var calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
var selDay=new Date(TODAY);
var nextWeek=addD(mondayOf(TODAY),7);

function startOfDay(x){var y=new Date(x);y.setHours(0,0,0,0);return y}
function mondayOf(x){var n=new Date(x);var k=(n.getDay()+6)%7;n.setDate(n.getDate()-k);n.setHours(0,0,0,0);return n}
function addD(x,n){var y=new Date(x);y.setDate(y.getDate()+n);return y}
function same(a,b){return a&&b&&a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function fmt(x){return x.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}
function dmy(x){return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function notionURL(id){return 'https://notion.so/'+String(id).replace(/-/g,'')}
function pdate(v){return v.postDate?startOfDay(new Date(v.postDate)):null}
// The cycle sets the deadline. Friday's session covers Mon, Tue and Wed;
// Wednesday's covers Thu, Fri and Sat. No Sunday posts.
var DUE_OFFSET={1:-3,2:-4,3:-5,4:-1,5:-2,6:-3,0:-2};
function dueOf(v){var p=pdate(v);return p?addD(p,DUE_OFFSET[p.getDay()]):null}

// Tue and Thu are topic days; Wed and Fri are scripting days.
function sessionFor(day){
  var d=day.getDay();
  if(d===2||d===4) return {kind:'topics'};
  if(d===3) return {kind:'script',covers:[addD(day,1),addD(day,2),addD(day,3)]};
  if(d===5) return {kind:'script',covers:[addD(day,3),addD(day,4),addD(day,5)]};
  return null;
}
function nextSessionDay(from){
  for(var i=0;i<8;i++){var d=addD(from,i); if(sessionFor(d)) return d}
  return null;
}
function onDates(dates){
  return V.filter(function(v){var p=pdate(v);
    return p&&dates.some(function(d){return same(d,p)})})
    .sort(function(a,b){return pdate(a)-pdate(b)});
}
function bankOf(c){return V.filter(function(v){return v.creator===c&&v.stage===1}).length}

// Script in hand: written, not yet posted, and not stuck behind a date that
// already passed. Undated scripts count — they are real work already done.
function inHand(c){return V.filter(function(v){
  var p=pdate(v);
  return v.creator===c&&v.stage>=5&&v.stage<12&&(!p||p>=TODAY)}).length}
function coversWeeks(c){return inHand(c)/rateOf(c)}
// Hold the cushion: write enough to get back up to it, nothing if already there.
function needFor(c){return Math.max(0,Math.round(rateOf(c)*cushion-inHand(c)))}
function tone(s){return s>=12?'n':(s>=5?'g':(s>=3?'a':'r'))}
function toneHex(s){return s>=12?'#3a4152':(s>=5?'var(--green)':(s>=3?'var(--amber)':'var(--red)'))}
function label(s){return STAGES[s]||('stage '+s)}
function kindChip(v){
  var out='';
  if(v.format) out+='<span class="k '+(v.format==='Long'?'k-l':'k-sh')+'">'+esc(v.format)+'</span>';
  if(v.kind) out+='<span class="k '+(v.kind==='Sponsor'?'k-s':'k-p')+'">'+esc(v.kind)+'</span>';
  return out;
}

// A video only counts as banked stock if it has not gone out yet. Anything
// still short of "posted" whose post date is already behind us is stuck,
// not inventory, so it is counted separately as stale.
var thisWeek=mondayOf(TODAY);

function stale(v){var p=pdate(v);return v.stage<12&&p&&p<TODAY}
// This week only counts from today forward — on a Saturday the first five
// days are already posted and would read as a plan when they are history.
var restFrom = TODAY, restTo = addD(mondayOf(TODAY),7);
var restDays = Math.max(0,Math.round((restTo-restFrom)/864e5));
function slotsRange(c,from,to){return V.filter(function(v){
  var p=pdate(v);return v.creator===c&&p&&p>=from&&p<to})}
function slots(c,w){return w===thisWeek?slotsRange(c,restFrom,restTo)
  :slotsRange(c,w,addD(w,7))}
function span(a,b){
  var e=addD(b,-1);
  return a.getMonth()===e.getMonth()
    ? a.getDate()+'–'+e.getDate()+' '+e.toLocaleDateString('en-GB',{month:'short'})
    : dmy(a)+' – '+dmy(e);
}
function scripted(list){return list.filter(function(v){return v.stage>=5}).length}
// Script that exists but isn't holding a slot — written, not scheduled.
function undated(c){return V.filter(function(v){
  return v.creator===c&&v.stage>=5&&v.stage<12&&!pdate(v)}).length}
function staleOf(c){return V.filter(function(v){return v.creator===c&&stale(v)}).length}

function rateOf(c){return RATE[c]||1}

function showBanner(msg){
  var b=document.getElementById('banner');
  if(!msg){b.style.display='none';return}
  b.style.display='block';b.textContent=msg;
}

async function load(fresh){
  try{
    var parts=[]; if(fresh) parts.push('fresh=1');
    var rq=rosterQS(); if(rq) parts.push(rq);
    var r=await fetch('/api/scripts'+(parts.length?'?'+parts.join('&'):''));
    if(!r.ok) throw new Error('api returned '+r.status);
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    V=j.videos||[]; RATE=j.rates||{}; CREATORS=j.creators||[];
    BUILTIN=j.builtIn||[]; FORMATS=j.formats||{};
    renderRoster();
    document.getElementById('hsub').textContent=
      'planning week of '+dmy(nextWeek)+' · '+V.length+' videos · '+
      V.filter(stale).length+' stuck past their post date · synced '+
      new Date(j.syncedAt).toLocaleTimeString('en-GB');
    showBanner((j.problems&&j.problems.length)?('Some boards did not load — '+j.problems.join(' · ')):'');
    render();
  }catch(e){
    showBanner('Could not reach Notion — '+e.message+'. Retrying in 20s.');
    setTimeout(function(){load(true)},20000);
  }
}

function dayName(x){return x.toLocaleDateString('en-GB',{weekday:'long'})}
function shortDay(x){return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}

function renderSession(){
  var box=document.getElementById('session');
  var today=sessionFor(TODAY);
  var day=today?TODAY:nextSessionDay(addD(TODAY,1));
  var ses=today||sessionFor(day);
  var isToday=!!today;
  var when=isToday?'Today, '+dayName(TODAY)+' '+dmy(TODAY)
                  :'Next up · '+dayName(day)+' '+dmy(day);

  if(ses.kind==='topics'){
    var rows=CREATORS.map(function(c){return {c:c,n:bankOf(c)}}).sort(function(a,b){return a.n-b.n});
    var total=rows.reduce(function(a,x){return a+x.n},0);
    box.innerHTML='<div class="chd"><span class="name">Add topics to the bank</span>'+
      '<span class="sub">'+when+'</span></div>'+
      '<div style="padding:13px 16px">'+
        '<div style="font-size:26px;font-weight:600;line-height:1">'+total+'</div>'+
        '<div class="sub" style="margin-bottom:11px">ideas sitting at stage 1 across the roster</div>'+
        rows.map(function(r){
          return '<div class="crow" style="padding:6px 0"><span>'+esc(r.c)+'</span>'+
          '<span class="chip '+(r.n?(r.n<3?'c-a':'c-g'):'c-r')+'">'+r.n+' idea'+(r.n===1?'':'s')+'</span></div>';
        }).join('')+
      '</div>';
    return;
  }

  var scope=onDates(ses.covers);
  var todo=scope.filter(function(v){return v.stage<5});
  var cov=ses.covers.map(shortDay).join(', ');
  box.innerHTML='<div class="chd"><span class="name">Script for '+cov+'</span>'+
    '<span class="sub">'+when+'</span></div>'+
    '<div style="padding:13px 16px '+(todo.length?'4px':'14px')+'">'+
      '<div style="font-size:26px;font-weight:600;line-height:1;color:'+
        (todo.length?'var(--amber)':'var(--green)')+'">'+todo.length+'</div>'+
      '<div class="sub">to write, out of '+scope.length+' posting those days</div>'+
    '</div>'+
    todo.map(function(v){
      return '<div class="crow">'+
        '<a class="vt" href="'+notionURL(v.id)+'" target="_blank" rel="noopener">'+
        '<span class="who">'+esc(v.creator)+' · </span>'+esc(v.title)+'</a>'+
        '<span style="white-space:nowrap">'+kindChip(v)+
        '<span class="chip c-'+tone(v.stage)+'">'+shortDay(pdate(v))+' · '+esc(label(v.stage))+'</span></span>'+
      '</div>';
    }).join('');
}

function render(){
  document.getElementById('cush').value=cushion;
  document.getElementById('cushlab').textContent=cushion+' week'+(cushion==1?'':'s');

  var tw=0,nw=0;
  CREATORS.forEach(function(c){
    tw+=slots(c,thisWeek).length; nw+=slots(c,nextWeek).length;
  });
  var ahead=0; CREATORS.forEach(function(c){ahead+=needFor(c)});
  var floor=addD(TODAY,-30);
  var risk=V.filter(function(v){var d=dueOf(v),p=pdate(v);
    return v.stage<5&&d&&d<=TODAY&&p&&p>=floor})
    .sort(function(a,b){return pdate(a)-pdate(b)});

  document.getElementById('k1lab').textContent=
    (restDays>1?'Left this week':'Posting today')+' · '+span(restFrom,restTo);
  document.getElementById('k1').textContent=tw;
  document.getElementById('k2').textContent=nw;
  document.getElementById('k3').textContent=ahead;
  document.getElementById('k4').textContent=risk.length;

  document.getElementById('riskbox').innerHTML = risk.length
    ? '<div class="chd" style="background:transparent;border-bottom:1px solid rgba(241,107,107,.22)">'+
      '<span class="name" style="color:var(--red)">Script already overdue against its post date</span>'+
      '<span class="sub">'+risk.length+'</span></div>'+
      risk.map(function(v){return '<div class="crow" style="border-top-color:rgba(241,107,107,.14)">'+
        '<a class="vt" href="'+notionURL(v.id)+'" target="_blank" rel="noopener"><span class="who">'+
        esc(v.creator)+' · </span>'+esc(v.title)+'</a>'+
        '<span style="white-space:nowrap">'+kindChip(v)+
        '<span class="chip c-r">posts '+dmy(pdate(v))+' · '+esc(label(v.stage))+'</span></span></div>'}).join('')
    : '<div class="empty">Nothing has blown its script deadline.</div>';

  document.getElementById('dec').innerHTML=CREATORS.map(function(c){
    var need=needFor(c), hand=inHand(c), wk=coversWeeks(c), bank=bankOf(c);
    var until=addD(TODAY,Math.round(wk*7));
    var open=V.filter(function(v){
      return v.creator===c&&v.stage<5&&pdate(v)&&pdate(v)>=TODAY})
      .sort(function(a,b){return dueOf(a)-dueOf(b)});

    var dated=open.length?'<div style="border-top:1px solid var(--line);margin-top:11px;padding-top:9px">'+
      '<div class="sub" style="margin-bottom:4px">Dated but not scripted</div>'+
      open.map(function(v){
        var due=dueOf(v), late=due<TODAY;
        return '<div class="between" style="gap:8px;padding:3px 0">'+
          '<a class="vt" style="font-size:12.5px" href="'+notionURL(v.id)+'" target="_blank" rel="noopener">'+
          esc(v.title)+'</a>'+
          '<span style="white-space:nowrap">'+kindChip(v)+
          '<span class="chip c-'+(late?'r':'a')+'">due '+shortDay(due)+'</span></span></div>';
      }).join('')+'</div>':'';

    return '<div class="card" style="overflow:hidden">'+
      '<div class="chd"><span class="name">'+esc(c)+
        '<span class="k '+((FORMATS[c]||'Short')==='Long'?'k-l':'k-sh')+'" style="margin-left:9px">'+
        esc(FORMATS[c]||'Short')+'</span></span>'+
        '<span class="sub">posts '+rateOf(c)+'/wk</span></div>'+
      '<div style="padding:13px 16px 14px">'+
        '<div class="between" style="align-items:flex-end">'+
          '<div>'+
            '<div style="font-size:30px;font-weight:600;line-height:1;color:'+
              (need?'var(--amber)':'var(--green)')+'">'+need+'</div>'+
            '<div class="sub">to write this week</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:15px;font-weight:500">'+hand+' in hand</div>'+
            '<div class="sub">'+(hand?'covers '+wk.toFixed(1)+' wks, to '+dmy(until):'nothing written')+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="meter" style="margin:12px 0 0"><i style="width:'+
          Math.min(100,Math.round(wk/cushion*100))+'%;background:'+
          (need?'var(--amber)':'var(--green)')+'"></i></div>'+
        dated+
        '<div class="between" style="border-top:1px solid var(--line);margin-top:10px;padding-top:9px">'+
          '<span class="sub">Topic bank</span>'+
          '<span style="font-size:14px;font-weight:500;color:'+
            (bank?(bank<3?'var(--amber)':'var(--green)'):'var(--red)')+'">'+bank+'</span>'+
        '</div>'+
      '</div></div>';
  }).join('');

  renderSession();
  renderHK();
  renderCal();
}

function onDay(day){
  return V.filter(function(v){
    if(who!=='all'&&v.creator!==who) return false;
    var d=calMode==='due'?dueOf(v):pdate(v);
    return same(d,day);
  }).sort(function(a,b){return a.stage-b.stage});
}

function renderCal(){
  document.getElementById('mlab').textContent=calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  document.getElementById('duenote').style.display=calMode==='due'?'inline':'none';
  document.getElementById('dows').innerHTML=['MON','TUE','WED','THU','FRI','SAT','SUN']
    .map(function(x){return '<div class="dow">'+x+'</div>'}).join('');
  document.getElementById('filters').innerHTML=
    '<button data-w="all" class="'+(who==='all'?'on':'')+'">All creators</button>'+
    CREATORS.map(function(c){return '<button data-w="'+esc(c)+'" class="'+(who===c?'on':'')+'">'+esc(c)+'</button>'}).join('');

  var start=mondayOf(new Date(calMonth.getFullYear(),calMonth.getMonth(),1)),cells='';
  for(var i=0;i<42;i++){
    var day=addD(start,i),list=onDay(day),out=day.getMonth()!==calMonth.getMonth();
    if(i>=35&&out) continue;
    var isToday=same(day,TODAY), isPast=day<TODAY;
    cells+='<button class="day'+(out?' out':'')+(isPast&&!isToday?' past':'')+
      (isToday?' today':'')+(same(day,selDay)?' sel':'')+'" data-i="'+i+'">'+
      '<div class="dnum"'+(isToday?' style="color:var(--blue);font-weight:600"':'')+'>'+day.getDate()+'</div>'+
      '<div class="dots">'+list.slice(0,12).map(function(v){
        return '<span class="dot" style="background:'+toneHex(v.stage)+'"></span>'}).join('')+'</div></button>';
  }
  document.getElementById('cal').innerHTML=cells;
  Array.prototype.forEach.call(document.querySelectorAll('.day'),function(b){
    b.onclick=function(){selDay=addD(start,+b.dataset.i);renderCal()}});
  Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(b){
    b.onclick=function(){who=b.dataset.w;renderCal()}});

  var sel=onDay(selDay),lab=calMode==='due'?'script due':'posting';
  var back=selDay<TODAY?' <span class="sub">· in the past</span>':'';
  document.getElementById('daypanel').innerHTML=
    '<div class="chd"><span class="name">'+fmt(selDay)+back+'</span><span class="sub">'+
    (sel.length?sel.length+' '+lab+' · '+sel.filter(function(v){return v.kind==='Sponsor'}).length+
      ' sponsor · '+sel.filter(function(v){return v.stage<5}).length+' unscripted':'nothing '+lab)+
    '</span></div>'+
    (sel.length?sel.map(function(v){return '<div class="crow">'+
      '<a class="vt" href="'+notionURL(v.id)+'" target="_blank" rel="noopener"><span class="who">'+
      esc(v.creator)+' · </span>'+esc(v.title)+'</a>'+
      '<span style="white-space:nowrap">'+kindChip(v)+
      '<span class="chip c-'+tone(v.stage)+'">'+v.stage+' · '+esc(label(v.stage))+
      (calMode==='due'&&pdate(v)?' · posts '+dmy(pdate(v)):'')+'</span></span></div>'}).join('')
      :'<div class="empty">Clear day.</div>');
}

function normId(raw){
  var hex=String(raw||'').trim().replace(/-/g,'').toLowerCase();
  var m=hex.match(/[0-9a-f]{32}/);
  if(!m) return null;
  hex=m[0];
  return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}

function renderRoster(){
  var box=document.getElementById('roster');
  var rows=BUILTIN.map(function(c){
    return {name:c,kind:(FORMATS[c]||'Short')+' form · built in',hidden:HIDDEN.indexOf(c)>=0};
  }).concat(EXTRA.map(function(x){
    return {name:x.creator,kind:(x.format||'Short')+' form · added here',hidden:false,ds:x.ds};
  }));

  box.innerHTML =
    '<div style="font-size:14px;font-weight:500;margin-bottom:10px">Creators on this dashboard</div>'+
    rows.map(function(r){
      return '<div class="rrow"><span'+(r.hidden?' style="color:var(--tx3);text-decoration:line-through"':'')+'>'+
        esc(r.name)+' <span class="sub">· '+r.kind+'</span></span>'+
        '<button class="x" data-act="'+(r.hidden?'show':'hide')+'" data-n="'+esc(r.name)+'" '+
        'aria-label="'+(r.hidden?'show':'remove')+' '+esc(r.name)+'">'+(r.hidden?'↺':'×')+'</button></div>';
    }).join('')+
    '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+
      '<div class="row" style="flex-wrap:wrap">'+
        '<input class="field" id="nname" placeholder="Creator name" style="width:170px">'+
        '<input class="field" id="nds" placeholder="Source data source ID" style="flex:1;min-width:230px">'+
        '<button id="nfmt" data-f="Short">Short</button>'+
        '<button id="nadd">Add</button>'+
      '</div>'+
      '<div class="err" id="nerr"></div>'+
      '<div class="sub">Duplicate an existing REELS board so the numbered statuses match, share it '+
      'with the NOOCAP Ops Dashboard integration, then paste the source data source ID here. '+
      'Saved in this browser only.</div>'+
    '</div>';

  Array.prototype.forEach.call(box.querySelectorAll('.x'),function(b){
    b.onclick=function(){
      var n=b.dataset.n;
      if(b.dataset.act==='hide'){
        if(BUILTIN.indexOf(n)>=0){ HIDDEN.push(n); writeLS('noocap_scripts_hidden',HIDDEN) }
        else { EXTRA=EXTRA.filter(function(x){return x.creator!==n}); writeLS('noocap_scripts_extra',EXTRA) }
      } else {
        HIDDEN=HIDDEN.filter(function(x){return x!==n}); writeLS('noocap_scripts_hidden',HIDDEN);
      }
      who='all'; load(true);
    };
  });

  var nameEl=document.getElementById('nname'), dsEl=document.getElementById('nds'),
      errEl=document.getElementById('nerr'), fmtEl=document.getElementById('nfmt');
  fmtEl.onclick=function(){
    var f=this.dataset.f==='Short'?'Long':'Short';
    this.dataset.f=f; this.textContent=f;
  };
  function clearErr(){errEl.textContent=''}
  nameEl.oninput=clearErr; dsEl.oninput=clearErr;

  document.getElementById('nadd').onclick=function(){
    var name=nameEl.value.trim(), ds=normId(dsEl.value);
    if(!name){ errEl.textContent='Enter a creator name first'; nameEl.focus(); return }
    if(!ds){ errEl.textContent='That does not look like a Notion data source ID — it should be 32 hex characters'; dsEl.focus(); return }
    if(BUILTIN.indexOf(name)>=0||EXTRA.some(function(x){return x.creator===name})){
      errEl.textContent=name+' is already on the list'; return }
    if(EXTRA.some(function(x){return x.ds===ds})){ errEl.textContent='That board is already added'; return }
    EXTRA.push({creator:name,ds:ds,format:fmtEl.dataset.f}); writeLS('noocap_scripts_extra',EXTRA);
    nameEl.value=''; dsEl.value=''; errEl.textContent='';
    load(true);
  };
}

function renderHK(){
  var box=document.getElementById('hk');
  box.innerHTML='<div class="chd"><span class="name">Board tidy-up</span>'+
    '<span class="sub">not part of this week\'s work</span></div>'+
    '<div style="padding:11px 16px 14px">'+
      '<div class="sub" style="margin-bottom:9px">Stuck means the post date has gone by and the '+
      'card never reached posted. Undated means the script is written with no slot booked.</div>'+
      CREATORS.map(function(c){
        var st=staleOf(c), u=undated(c);
        return '<div class="crow" style="padding:7px 0"><span>'+esc(c)+'</span>'+
          '<span style="white-space:nowrap">'+
            '<span class="chip '+(st?'c-a':'c-n')+'" style="margin-right:6px">'+st+' stuck</span>'+
            '<span class="chip c-n">'+u+' undated</span>'+
          '</span></div>';
      }).join('')+
    '</div>';
}

document.getElementById('hkbtn').onclick=function(){
  var box=document.getElementById('hk');
  var open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  this.classList.toggle('on',!open);
};

document.getElementById('cush').oninput=function(){
  cushion=+this.value;
  try{localStorage.setItem('noocap_scripts_cushion',cushion)}catch(e){}
  render();
};

document.getElementById('rosterbtn').onclick=function(){
  var box=document.getElementById('roster');
  var open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  this.classList.toggle('on',!open);
};

document.getElementById('reload').onclick=function(){load(true)};
document.getElementById('mtoday').onclick=function(){
  calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  selDay=new Date(TODAY); renderCal();
};
document.getElementById('mp').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderCal()};
document.getElementById('mn').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderCal()};
document.getElementById('vpost').onclick=function(){calMode='post';this.classList.add('on');document.getElementById('vdue').classList.remove('on');renderCal()};
document.getElementById('vdue').onclick=function(){calMode='due';this.classList.add('on');document.getElementById('vpost').classList.remove('on');renderCal()};

load(false);
setInterval(function(){ if(!saving) load(false) }, 30000);
</script>
</body>
